name: Exportar modpack (.mrpack)

on:
  push:
    paths: ["pack/**", "servidor/**", ".github/workflows/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Instalar packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Exportar .mrpack
        working-directory: pack
        run: |
          VERSION=$(grep '^version' pack.toml | cut -d'"' -f2)
          ~/go/bin/packwiz refresh --build
          ~/go/bin/packwiz mr export -o "../ReinosDeAventura-${VERSION}.mrpack"
      - uses: actions/upload-artifact@v4
        with:
          name: ReinosDeAventura-mrpack
          path: ReinosDeAventura-*.mrpack
      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReinosDeAventura-*.mrpack

  servidor:
    # Genera la carpeta del servidor (mods + config + server.properties) lista para subir a un hosting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Descargar mods del servidor
        run: |
          mkdir -p servidor-hosting && cd servidor-hosting
          curl -fsSLo pib.jar https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
          curl -fsSLo packwiz-installer.jar https://github.com/packwiz/packwiz-installer/releases/latest/download/packwiz-installer.jar
          java -jar pib.jar --bootstrap-no-update -g -s server ../pack/pack.toml
          rm -f pib.jar packwiz-installer.jar packwiz.json
          cp ../servidor/server.properties.plantilla server.properties
          ls mods | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: ReinosDeAventura-servidor
          path: servidor-hosting/
          compression-level: 0
