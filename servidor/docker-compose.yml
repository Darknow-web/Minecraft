# Alternativa con Docker (Linux / VPS). Uso:  docker compose up -d   (desde esta carpeta)
# Consola del servidor:  docker attach reinos-de-aventura   (salir: Ctrl+P, Ctrl+Q)
services:
  mc:
    image: itzg/minecraft-server:java17
    container_name: reinos-de-aventura
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"        # Minecraft
      - "24454:24454/udp"    # Simple Voice Chat
    environment:
      EULA: "TRUE"           # Aceptas https://aka.ms/MinecraftEULA
      TYPE: FORGE
      VERSION: "1.20.1"
      FORGE_VERSION: "47.4.10"
      PACKWIZ_URL: /pack/pack.toml
      MEMORY: 8G
      USE_AIKAR_FLAGS: "true"
      MOTD: "Reinos de Aventura - dragones, mazmorras y magia"
      MAX_PLAYERS: 10
      DIFFICULTY: normal
      ALLOW_FLIGHT: "TRUE"
      SPAWN_PROTECTION: 0
      VIEW_DISTANCE: 8
      SIMULATION_DISTANCE: 6
      ENABLE_WHITELIST: "TRUE"
      # WHITELIST: "jugador1,jugador2"
      # OPS: "tu_nick"
    volumes:
      - ../pack:/pack:ro
      - ./datos:/data
